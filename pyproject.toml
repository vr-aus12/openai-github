[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "message-first-ipaas"
version = "0.1.0"
description = "Enterprise message-first iPaaS reference implementation"
requires-python = ">=3.10"

[project.scripts]
message-first-ipaas = "message_first_ipaas.app:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
